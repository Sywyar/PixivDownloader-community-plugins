name: Complete community review
run-name: 'Complete community review PR #${{ inputs.prNumber }} head ${{ inputs.expectedHeadSha }}'
on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: Open community request PR number
        required: true
        type: string
      expectedHeadSha:
        description: Full reviewed PR head SHA
        required: true
        type: string
      reason:
        description: Review conclusion and evidence
        required: true
        type: string
      recoveryApproved:
        description: Explicitly approve missing-key or ownership recovery
        type: boolean
        default: false
      organizationRepresentations:
        description: Reviewed organizationId:personId pairs, comma separated
        type: string
        default: ''
permissions:
  contents: read
jobs:
  preflight:
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      projections: ${{ steps.preflight.outputs.projections }}
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository_id == '1347624983' &&
      github.repository_owner_id == '83223374' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 预检需要读取 Draft Release，不向投稿源码提供此 token。
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - id: preflight
        run: node scripts/community-publication.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
  apply:
    if: needs.preflight.outputs.ready == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - run: ":"
  store:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: community-status
    concurrency:
      group: community-publication
      queue: max
    outputs:
      projections: ${{ steps.merge.outputs.projections || steps.store.outputs.projections || steps.prepare.outputs.projections }}
    permissions:
      contents: write
      actions: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - id: prepare
        run: node scripts/community-publication.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_REVIEW_BRANCH_SSH_KEY: ${{ secrets.COMMUNITY_REVIEW_BRANCH_SSH_KEY != '' }}
          COMMUNITY_RELEASE_KEY_ID: ${{ vars.COMMUNITY_RELEASE_KEY_ID }}
          COMMUNITY_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.COMMUNITY_RELEASE_PUBLIC_KEY_BASE64 }}
          COMMUNITY_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.COMMUNITY_RELEASE_PRIVATE_KEY_BASE64 }}
      - id: proof
        if: steps.prepare.outputs.manifest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.prepare.outputs.manifest }}
          create-storage-record: false
      - id: store
        if: steps.prepare.outputs.manifest != ''
        run: node scripts/community-publication.mjs store
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_REVIEW_BRANCH_SSH_KEY: ${{ secrets.COMMUNITY_REVIEW_BRANCH_SSH_KEY }}
          COMMUNITY_PUBLICATION_FILE: ${{ steps.prepare.outputs.manifest }}
          COMMUNITY_ATTESTATION_BUNDLE: ${{ steps.proof.outputs.bundle-path }}
      - id: app
        if: steps.store.outputs.head != '' || steps.prepare.outputs.head != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23lixorUs94dx1xEvB
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          owner: Sywyar
          repositories: PixivDownloader-community-plugins
          permission-checks: write
      - id: merge
        if: steps.store.outputs.head != '' || steps.prepare.outputs.head != ''
        run: node scripts/community-publication.mjs merge
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_STATUS_HEAD: ${{ steps.store.outputs.head || steps.prepare.outputs.head }}
          COMMUNITY_REVIEW_BRANCH_TOKEN: ${{ secrets.COMMUNITY_REVIEW_BRANCH_TOKEN }}
          GATE_TOKEN: ${{ steps.app.outputs.token }}
  notify:
    needs: [preflight, apply, store]
    if: always() && (needs.store.outputs.projections || needs.preflight.outputs.projections || '[]') != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node scripts/community-publication.mjs notify
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_PROJECTIONS: ${{ needs.store.outputs.projections || needs.preflight.outputs.projections }}
