name: Complete community review
run-name: 'Complete community review PR #${{ inputs.prNumber }} head ${{ inputs.expectedHeadSha }}'
on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: Open community request PR number
        required: true
        type: string
      expectedHeadSha:
        description: Full reviewed PR head SHA
        required: true
        type: string
      reason:
        description: Review conclusion and evidence
        required: true
        type: string
      recoveryApproved:
        description: Explicitly approve missing-key or ownership recovery
        type: boolean
        default: false
      organizationRepresentations:
        description: Reviewed organizationId:personId pairs, comma separated
        type: string
        default: ''
permissions:
  contents: read
jobs:
  preflight:
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      projections: ${{ steps.preflight.outputs.projections }}
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository_id == '1347624983' &&
      github.repository_owner_id == '83223374' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 预检需要读取 Draft Release，不向投稿源码提供此 token。
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - id: preflight
        run: node scripts/community-publication.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
  apply:
    if: needs.preflight.outputs.ready == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    outputs:
      projections: ${{ steps.prepare.outputs.projections }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - id: prepare
        run: node scripts/community-publication.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_REVIEW_BRANCH_TOKEN: ${{ secrets.COMMUNITY_REVIEW_BRANCH_TOKEN != '' }}
          COMMUNITY_RELEASE_KEY_ID: ${{ vars.COMMUNITY_RELEASE_KEY_ID }}
          COMMUNITY_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.COMMUNITY_RELEASE_PUBLIC_KEY_BASE64 }}
          COMMUNITY_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.COMMUNITY_RELEASE_PRIVATE_KEY_BASE64 }}
      - id: proof
        if: steps.prepare.outputs.manifest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.prepare.outputs.manifest }}
          create-storage-record: false
      - if: steps.prepare.outputs.manifest != ''
        run: |
          install -D -- "$MANIFEST" target/review-handoff/publication.json
          install -D -- "$BUNDLE" target/review-handoff/publication-attestation.json
        env:
          MANIFEST: ${{ steps.prepare.outputs.manifest }}
          BUNDLE: ${{ steps.proof.outputs.bundle-path }}
      - id: upload
        if: steps.prepare.outputs.manifest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-handoff-${{ github.run_attempt }}
          path: target/review-handoff
          if-no-files-found: error
          retention-days: 1
  store:
    needs: apply
    if: needs.apply.outputs.artifact != '' || needs.apply.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: community-status
    concurrency:
      group: community-publication
      queue: max
    outputs:
      projections: ${{ steps.store.outputs.projections }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - if: needs.apply.outputs.artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.apply.outputs.artifact }}
          path: target/review-handoff
          merge-multiple: true
      - id: store
        if: needs.apply.outputs.artifact != ''
        run: node scripts/community-publication.mjs store
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_REVIEW_BRANCH_TOKEN: ${{ secrets.COMMUNITY_REVIEW_BRANCH_TOKEN }}
          COMMUNITY_PUBLICATION_FILE: target/review-handoff/publication.json
          COMMUNITY_ATTESTATION_BUNDLE: target/review-handoff/publication-attestation.json
  notify:
    needs: [preflight, apply, store]
    if: always() && (needs.store.outputs.projections || needs.apply.outputs.projections || needs.preflight.outputs.projections || '[]') != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: node scripts/community-publication.mjs notify
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_PROJECTIONS: ${{ needs.store.outputs.projections || needs.apply.outputs.projections || needs.preflight.outputs.projections }}
