name: Community emergency
run-name: 'Emergency PR #${{ github.event.pull_request.number || inputs.prNumber }}'
on:
  pull_request_target:
    branches: [emergency-state]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      prNumber:
        description: Emergency request PR number
        required: true
        type: string
      expectedHeadSha:
        description: Exact current request head
        required: true
        type: string
permissions:
  contents: read
# 与正常准入和最终写入串行，构建仍在各自只读作业中执行。
concurrency:
  group: community-publication
  queue: max
jobs:
  apply:
    if: >-
      github.repository_id == '1347624983' && github.repository_owner_id == '83223374' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: community-status
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23lixorUs94dx1xEvB
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          owner: Sywyar
          repositories: PixivDownloader-community-plugins
          permission-checks: write
      - run: node scripts/community-emergency.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_TOKEN: ${{ steps.app.outputs.token }}
          COMMUNITY_REVIEW_BRANCH_TOKEN: ${{ secrets.COMMUNITY_REVIEW_BRANCH_TOKEN }}
