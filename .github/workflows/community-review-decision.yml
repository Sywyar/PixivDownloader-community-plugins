name: Community review decision
run-name: 'Community decision PR #${{ inputs.prNumber }} head ${{ inputs.expectedHeadSha }}'
on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: PR number
        required: true
        type: string
      expectedHeadSha:
        description: Full head SHA you reviewed
        required: true
        type: string
      action:
        description: Decision action
        required: true
        type: choice
        options: [FALSE_POSITIVE, MANUAL_SCAN_ACCEPTED, SELF_REVIEW_APPROVED, REVOKE_DECISION]
      scanRunId:
        description: Required for a scan decision
        required: false
        type: string
      scanRunAttempt:
        description: Required for a scan decision
        required: false
        type: string
      findingIds:
        description: Finding IDs for FALSE_POSITIVE
        required: false
        type: string
      targetDecisionSha256:
        description: Decision digest for REVOKE_DECISION
        required: false
        type: string
      reason:
        description: What you reviewed and why (at most 2048 Unicode characters)
        required: true
        type: string
      confirmSelfReview:
        description: I am the PR author and have reviewed this exact head
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: community-review-state
  queue: max
jobs:
  decision:
    if: github.repository == 'Sywyar/PixivDownloader-community-plugins' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # GitHub 仅向有推送权限的身份返回 Draft Release；这里只执行受保护主线代码。
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - id: decision
        run: node scripts/decisions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.decision.outputs.artifact }}
          path: target/decision/decision.json
          if-no-files-found: error
          overwrite: false
