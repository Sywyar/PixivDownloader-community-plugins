name: Community candidate archive
on:
  workflow_run:
    workflows: [Submission static check]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: community-candidate-archive
  queue: max
jobs:
  archive:
    if: >-
      github.repository == 'Sywyar/PixivDownloader-community-plugins' &&
      github.ref == 'refs/heads/master' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: community-gate
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
      - id: archive
        run: node scripts/archive-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - id: proof
        if: steps.archive.outputs.manifest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.archive.outputs.manifest }}
          create-storage-record: false
      - if: steps.archive.outputs.manifest != ''
        run: node scripts/archive-run.mjs attestation
        env:
          GH_TOKEN: ${{ github.token }}
          COMMUNITY_RELEASE_ID: ${{ steps.archive.outputs.release }}
          COMMUNITY_CANDIDATE_FILE: ${{ steps.archive.outputs.manifest }}
          COMMUNITY_ATTESTATION_BUNDLE: ${{ steps.proof.outputs.bundle-path }}
