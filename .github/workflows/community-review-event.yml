name: Community review event
run-name: 'Review PR #${{ github.event.pull_request.number }}'
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions: {}
jobs:
  event:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # 仅唤醒受保护的读取器；该运行的状态和输出不参与准入。
      - run: echo "Review event received"
